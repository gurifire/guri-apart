<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#152640" />
  <title>구리시 공동주택 소방시설 지도 - 초안</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" />
  <style>
    :root {
      --navy:#152640; --navy-2:#203a60; --paper:#f4f7fb; --white:#fff;
      --text:#172033; --muted:#627086; --line:#dce3ec; --receiver:#1677d2; --receiver-marker:#1677d2;
      --siamese:#e33b42; --shadow:0 12px 34px rgba(19,38,66,.17);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--text);background:var(--paper)}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
    header{z-index:1000;background:linear-gradient(135deg,var(--navy),var(--navy-2));padding:14px 16px 12px;color:#fff;box-shadow:0 5px 20px rgba(12,28,48,.2)}
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1280px;margin:auto}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .badge{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--receiver);display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
    h1{font-size:1.08rem;line-height:1.25;margin:0;font-weight:800;letter-spacing:-.02em}
    .subtitle{font-size:.78rem;color:#cbd8e9;margin-top:3px}
    .draft{font-size:.72rem;font-weight:800;padding:5px 8px;border-radius:999px;background:#ffcf5a;color:#3d3000;white-space:nowrap}
    .search-wrap{max-width:1280px;margin:12px auto 0;display:flex;gap:8px}
    .menu-btn{flex:0 0 44px;width:44px;height:44px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:1.35rem;line-height:1;font-weight:800;display:grid;place-items:center}
    .search{position:relative;flex:1}
    .search input{width:100%;height:44px;border:0;border-radius:12px;padding:0 42px 0 42px;color:var(--text);outline:none;box-shadow:0 4px 12px rgba(5,16,31,.12)}
    .search::before{content:'⌕';position:absolute;left:14px;top:7px;color:#43526a;font-size:1.55rem;z-index:1}
    .clear{display:none;position:absolute;right:9px;top:8px;width:28px;height:28px;border:0;border-radius:50%;background:#e8edf4;color:#516078}
    .locate{height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;white-space:nowrap}
    main{position:relative;min-height:0}
    #map{height:100%;width:100%;background:#dfe6ec}
    .legend{position:absolute;z-index:600;left:10px;top:10px;background:rgba(255,255,255,.96);padding:10px 12px;border-radius:12px;box-shadow:0 6px 20px rgba(22,38,61,.16);font-size:.8rem;line-height:1.8}
    .legend-title{font-weight:800;border-bottom:1px solid var(--line);margin-bottom:5px}
    .dot{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.22)}
    .dot.apt{background:var(--navy);border-radius:50%}.dot.receiver{background:var(--receiver-marker);border-radius:1px}.dot.siamese{position:relative;background:#fff;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none}.dot.siamese::after{content:'';position:absolute;inset:2px 2px 1px;background:var(--siamese);clip-path:polygon(50% 0,100% 100%,0 100%)}
    .drawer-backdrop{position:absolute;z-index:610;inset:0;background:rgba(8,20,38,.38);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
    .drawer-backdrop.open{opacity:1;visibility:visible}
    .list-panel{position:absolute;z-index:620;left:0;top:0;width:66.666vw;height:100%;max-height:none;overflow:auto;background:rgba(255,255,255,.985);box-shadow:14px 0 32px rgba(12,28,48,.25);padding:14px;transform:translateX(-105%);transition:transform .28s ease;border-radius:0 18px 18px 0}
    .list-panel.open{transform:translateX(0)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 9px}
    .panel-title{display:flex;align-items:center;gap:8px}.drawer-close{width:34px;height:34px;border:0;border-radius:9px;background:#edf1f6;color:#364760;font-size:1.15rem;line-height:1}
    .panel-head strong{font-size:.95rem}.count{color:var(--muted);font-size:.78rem}
    .apt-card{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;color:var(--text)}
    .apt-card:hover,.apt-card:focus{border-color:#8ca5c5;background:#f7faff;outline:none}
    .apt-card.active{border:2px solid var(--navy-2);background:#edf4fd}
    .apt-name{font-size:.94rem;font-weight:800}.apt-address{font-size:.75rem;color:var(--muted);margin-top:5px;line-height:1.4}
    .facility-count{font-size:.72rem;color:#40516a;margin-top:8px}
    .marker{display:grid;place-items:center;width:15px;height:15px;padding:0;border-radius:50%;border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);color:#fff;font-weight:900;line-height:1;cursor:pointer}
    .marker span{font-size:5px;letter-spacing:-.35px}.marker.apt{background:var(--navy)}.marker.apt.active{transform:scale(1.25);box-shadow:0 0 0 2px rgba(32,58,96,.25),0 2px 5px rgba(0,0,0,.3)}
    .facility-marker{width:18px;height:18px;padding:0;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.42);cursor:pointer;transition:opacity .15s}
    .dong-marker{padding:2px 5px;border:1.5px solid #203a60;border-radius:5px;background:rgba(255,255,255,.94);color:#152640;font-size:11px;font-weight:900;line-height:1;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.24);pointer-events:none}.dong-marker.editing{pointer-events:auto;cursor:grab;animation:editPulse 1.35s ease-in-out infinite}.marker.apt.editing{cursor:grab;animation:editPulse 1.35s ease-in-out infinite}.dong-marker.hidden{display:none}.facility-marker:hover{opacity:.86}.facility-marker.receiver{background:var(--receiver-marker);border-radius:2px}.facility-marker.siamese{position:relative;background:#fff;border:0;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}.facility-marker.siamese::after{content:'';position:absolute;inset:3px 3px 2px;background:var(--siamese);clip-path:polygon(50% 0,100% 100%,0 100%);pointer-events:none}.facility-marker.hidden{display:none}
    .map-style-control{display:flex;flex-direction:column;gap:4px;margin:10px}.map-style-control button{min-width:76px;border:1px solid #c9d2df;border-radius:6px;background:#fff;color:#243550;padding:7px 9px;font-size:.76rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.13)}.map-style-control button.active{background:#203a60;color:#fff;border-color:#203a60}
    .naver-map-style-control{position:absolute;z-index:500;left:0;bottom:0}
    .edit-tools-stack{position:absolute;z-index:560;right:10px;top:10px;width:min(286px,calc(100% - 20px));display:flex;flex-direction:column;gap:8px;align-items:stretch}.edit-lock{display:grid;grid-template-columns:1fr auto;gap:6px;padding:7px;background:rgba(255,255,255,.97);border:1px solid #d5deea;border-radius:11px;box-shadow:0 5px 18px rgba(20,38,65,.16)}.edit-lock input{min-width:0;height:30px;border:1px solid #cbd6e4;border-radius:7px;padding:4px 8px;font-size:.7rem;outline:none}.edit-lock input:focus{border-color:#1677d2;box-shadow:0 0 0 2px rgba(22,119,210,.12)}.edit-lock button{height:30px;border:0;border-radius:7px;background:#203a60;color:#fff;padding:0 10px;font-size:.68rem;font-weight:800}.edit-lock-status{grid-column:1/-1;min-height:13px;color:#627086;font-size:.61rem;line-height:1.25}.edit-lock-status.error{color:#c43139}.edit-lock-status.unlocked{color:#16703b;font-weight:750}.edit-tools-panel{width:100%;background:rgba(255,255,255,.97);border:1px solid #d5deea;border-radius:13px;box-shadow:0 7px 24px rgba(20,38,65,.2);overflow:hidden}.edit-tools-toggle{width:100%;min-height:40px;border:0;background:#152640;color:#fff;padding:10px 12px;font-size:.8rem;font-weight:800;text-align:left;display:flex;align-items:center;justify-content:space-between}.edit-tools-toggle::after{content:'＋';font-size:1rem}.edit-tools-panel.open>.edit-tools-toggle::after{content:'−'}.edit-tools-toggle:disabled{opacity:.58;cursor:not-allowed}.edit-tools-body{display:none;padding:8px;background:#f2f5f9}.edit-tools-panel.open>.edit-tools-body{display:flex;flex-direction:column;gap:8px}.correction-panel{position:relative;width:100%;background:rgba(255,255,255,.97);border:1px solid #d5deea;border-radius:10px;overflow:hidden}
    .correction-toggle{width:100%;min-height:40px;border:0;background:#203a60;color:#fff;padding:10px 12px;font-size:.8rem;font-weight:800;text-align:left;display:flex;align-items:center;justify-content:space-between}.correction-toggle::after{content:'＋';font-size:1rem}.correction-panel.open .correction-toggle::after{content:'−'}.correction-toggle:disabled,.shape-editor-toggle:disabled{opacity:.58;cursor:not-allowed}
    .correction-body{display:none;padding:10px}.correction-panel.open .correction-body{display:block}.correction-help{margin:0 0 8px;color:#526178;font-size:.7rem;line-height:1.45}.correction-status{padding:7px 8px;border-radius:8px;background:#eef3f9;color:#33455e;font-size:.7rem;font-weight:700;line-height:1.4;margin-bottom:8px}.correction-status.active{background:#fff1d6;color:#694900}
    .correction-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.correction-actions button{min-height:34px;border:1px solid #cbd6e4;border-radius:8px;background:#fff;color:#263a56;font-size:.7rem;font-weight:750;padding:6px}.correction-actions button.primary{grid-column:1/-1;background:#e33b42;color:#fff;border-color:#e33b42}.correction-actions button:disabled{opacity:.42;cursor:not-allowed}.correction-count{margin-top:7px;color:#627086;font-size:.68rem;text-align:right}
    .coordinate-editor{margin:0 0 8px;padding:8px;border:1px solid #d7e0eb;border-radius:9px;background:#f8fafc}.coordinate-selected{font-size:.69rem;font-weight:800;color:#263a56;line-height:1.4;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.coordinate-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.coordinate-grid label{font-size:.64rem;color:#627086}.coordinate-grid input{width:100%;margin-top:3px;border:1px solid #cbd6e4;border-radius:7px;background:#fff;padding:7px 6px;font-size:.7rem;color:#172033;outline:none}.coordinate-grid input:focus{border-color:#1677d2;box-shadow:0 0 0 2px rgba(22,119,210,.12)}.coordinate-apply{width:100%;margin-top:6px;min-height:32px;border:0;border-radius:7px;background:#1677d2;color:#fff;font-size:.7rem;font-weight:800}.coordinate-apply:disabled,.coordinate-grid input:disabled{opacity:.45;cursor:not-allowed}.coordinate-error{min-height:14px;margin-top:4px;color:#c43139;font-size:.62rem;line-height:1.3}
    .facility-marker.editing{cursor:grab;animation:editPulse 1.35s ease-in-out infinite}.facility-marker.editing:active{cursor:grabbing}@keyframes editPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(255,204,0,0))}50%{filter:drop-shadow(0 0 5px rgba(255,177,0,.95))}}
    .detail{position:absolute;z-index:700;left:50%;bottom:18px;transform:translate(-50%,calc(100% + 40px));opacity:0;width:min(620px,calc(100% - 28px));background:#fff;border-radius:18px;box-shadow:var(--shadow);transition:.25s ease;padding:18px;pointer-events:none}
    .detail.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
    .detail-top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
    .detail-type{font-size:.74rem;font-weight:800;margin-bottom:4px}.detail h2{font-size:1.08rem;margin:0 0 4px}.detail p{margin:0;color:var(--muted);font-size:.85rem;line-height:1.55}.detail-summary{margin-top:5px;font-size:.9rem;font-weight:750;color:#33445d;line-height:1.45}
    .close{border:0;background:#eef2f7;color:#40516a;width:34px;height:34px;border-radius:10px;font-size:1.1rem}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.info{background:#f5f7fa;border-radius:10px;padding:10px}.info b{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px}.info span{font-size:.86rem;line-height:1.4}
    .maplibregl-ctrl-attrib{font-size:9px!important}
    @media(max-width:720px){
      header{padding:11px 12px 10px}.badge{width:34px;height:34px}.subtitle{display:none}.draft{font-size:.66rem}.search-wrap{margin-top:9px}.locate{width:44px;padding:0;font-size:0}.locate::after{content:'◎';font-size:1.25rem}
      .map-style-control{flex-direction:row;gap:3px;margin:0 0 62px 10px}.map-style-control button{min-width:0;padding:7px 9px;font-size:.68rem}
      .legend{left:10px;right:auto;top:10px;padding:7px 9px;font-size:.68rem;line-height:1.5}.legend-title{margin-bottom:3px}
      .edit-tools-stack{right:8px;top:8px;width:218px;gap:6px}.edit-lock{padding:6px;gap:5px}.edit-lock input,.edit-lock button{height:28px}.edit-tools-toggle,.correction-toggle,.shape-editor-toggle{min-height:36px;padding:8px 10px;font-size:.72rem}.edit-tools-body{padding:6px;gap:6px}.correction-body{padding:8px}
      .list-panel{width:66.666vw;padding:10px;border-radius:0 14px 14px 0}.panel-head{padding:1px 2px 8px}.panel-head strong{font-size:.88rem}.count{font-size:.7rem}.drawer-close{width:32px;height:32px}.apt-card{padding:9px 10px;margin-bottom:6px;border-radius:10px}.apt-name{font-size:.8rem;line-height:1.4}.apt-address{display:none}.facility-count{margin-top:4px;font-size:.65rem;line-height:1.4}
      .detail{bottom:10px;padding:15px}.info-grid{grid-template-columns:1fr}.detail h2{font-size:1rem}
    }

    .shape-editor{position:relative;width:100%;background:rgba(255,255,255,.98);border:1px solid #ccd7e5;border-radius:10px;overflow:hidden}.shape-editor-toggle{width:100%;min-height:40px;border:0;background:#344968;color:#fff;padding:10px 12px;font-size:.8rem;font-weight:800;text-align:left;display:flex;align-items:center;justify-content:space-between}.shape-editor-toggle::after{content:'＋'}.shape-editor.open .shape-editor-toggle::after{content:'−'}.shape-editor-body{display:none;padding:10px}.shape-editor.open .shape-editor-body{display:block}.shape-help{margin:0 0 8px;color:#526178;font-size:.68rem;line-height:1.4}.shape-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.shape-tools button,.shape-actions button{min-height:32px;border:1px solid #cbd6e4;border-radius:7px;background:#fff;color:#263a56;font-size:.67rem;font-weight:750;padding:5px}.shape-tools button.active{background:#203a60;color:#fff;border-color:#203a60}.shape-color-row{display:grid;grid-template-columns:auto 44px 1fr;align-items:center;gap:7px;margin:8px 0}.shape-color-row label{font-size:.68rem;font-weight:750}.shape-color-row input[type=color]{width:44px;height:32px;padding:2px;border:1px solid #bdc9d8;border-radius:7px;background:#fff}.shape-color-row button{height:32px;border:1px solid #bdc9d8;border-radius:7px;background:#fff;font-size:.67rem;font-weight:750}.shape-angle-row{display:grid;grid-template-columns:auto 1fr 50px;align-items:center;gap:6px;margin:0 0 8px;padding:7px;border:1px solid #d7e0eb;border-radius:8px;background:#f8fafc}.shape-angle-row label{font-size:.68rem;font-weight:800;color:#33455e}.shape-angle-row input{width:100%;height:31px;border:1px solid #bdc9d8;border-radius:7px;padding:4px 6px;text-align:right;font-size:.7rem}.shape-angle-row button{height:31px;border:1px solid #1677d2;border-radius:7px;background:#1677d2;color:#fff;font-size:.67rem;font-weight:800}.shape-angle-row input:disabled,.shape-angle-row button:disabled{opacity:.42;cursor:not-allowed}.shape-rotate-line{stroke:#1677d2;stroke-width:2;pointer-events:none}.shape-rotate-handle{fill:#fff;stroke:#1677d2;stroke-width:3;cursor:grab;pointer-events:all}.shape-rotate-handle:active{cursor:grabbing}.shape-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.shape-status{margin-top:7px;padding:6px 7px;border-radius:7px;background:#eef3f9;color:#33455e;font-size:.64rem;line-height:1.35}.shape-overlay{position:absolute;inset:0;width:100%;height:100%;z-index:545;pointer-events:none}.shape-overlay.editing{pointer-events:auto;touch-action:none}.shape-building{cursor:pointer;pointer-events:all}.shape-building.selected{filter:drop-shadow(0 0 3px #1677d2)}.shape-handle{fill:#fff;stroke:#1677d2;stroke-width:2;cursor:move;pointer-events:all}.shape-preview{fill:none;stroke:#1677d2;stroke-width:2;stroke-dasharray:6 4;pointer-events:none}@media(max-width:720px){.shape-editor-toggle{min-height:36px;padding:8px 10px;font-size:.72rem}.shape-editor-body{padding:8px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <div class="brand"><div class="badge">119</div><div><h1>구리시 공동주택 소방시설 지도</h1><div class="subtitle">아파트 83개소 위치 및 기본정보</div></div></div>
      </div>
      <div class="search-wrap">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="아파트 목록 열기" aria-controls="apartmentDrawer" aria-expanded="false">☰</button>
        <div class="search"><input id="searchInput" aria-label="아파트 검색" placeholder="아파트명 또는 주소 검색" autocomplete="off"/><button class="clear" id="clearBtn" aria-label="검색어 지우기">×</button></div>
        <button class="locate" id="locateBtn">현재 위치</button>
      </div>
    </header>
    <main>
      <div id="map" aria-label="구리시 공동주택 현황 지도"></div>
      <div class="legend"><div class="legend-title">시설 범례</div><div><span class="dot siamese"></span>연결송수관</div><div><span class="dot receiver"></span>수신반</div></div>
      <div class="edit-tools-stack">
      <section class="edit-lock" aria-label="편집 도구 암호 입력">
        <input id="editPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="편집 암호" aria-label="편집 암호">
        <button id="editUnlockBtn" type="button">확인</button>
        <div class="edit-lock-status" id="editLockStatus">암호 입력 후 편집 도구를 사용할 수 있습니다.</div>
      </section>
      <section class="edit-tools-panel" id="editToolsPanel" aria-label="편집 도구">
        <button class="edit-tools-toggle" id="editToolsToggle" type="button" aria-expanded="false" disabled>편집도구</button>
        <div class="edit-tools-body">
      <section class="correction-panel" id="correctionPanel" aria-label="시설 좌표 보정 도구">
        <button class="correction-toggle" id="correctionToggle" type="button" aria-expanded="false">좌표 보정 도구</button>
        <div class="correction-body">
          <p class="correction-help">아파트를 선택한 뒤 보정 모드를 켜고 시설·동번호·APT 마커를 끌거나 위도·경도를 직접 입력하세요.</p>
          <div class="correction-status" id="correctionStatus">보정 모드 꺼짐</div>
          <div class="coordinate-editor">
            <div class="coordinate-selected" id="coordinateSelected">수정할 마커를 선택해 주세요</div>
            <div class="coordinate-grid">
              <label>위도<input id="coordinateLat" inputmode="decimal" placeholder="37.00000000" disabled></label>
              <label>경도<input id="coordinateLng" inputmode="decimal" placeholder="127.00000000" disabled></label>
            </div>
            <button class="coordinate-apply" id="coordinateApplyBtn" type="button" disabled>입력 좌표 적용</button>
            <div class="coordinate-error" id="coordinateError" role="alert"></div>
          </div>
          <div class="correction-actions">
            <button class="primary" id="correctionModeBtn" type="button">좌표 보정 시작</button>
            <button id="undoCorrectionBtn" type="button" disabled>마지막 수정 취소</button>
            <button id="resetCorrectionBtn" type="button" disabled>전체 원복</button>
            <button id="exportCorrectionBtn" type="button" disabled>CSV 내보내기</button>
            <button id="clearSavedBtn" type="button" disabled>선택 마커 원복</button>
          </div>
          <div class="correction-count" id="correctionCount">수정된 마커 0개</div>
        </div>
      </section>

      <section class="shape-editor" id="shapeEditor" aria-label="아파트 동 모양 편집 도구">
        <button class="shape-editor-toggle" id="shapeEditorToggle" type="button" aria-expanded="false">동 모양 그리기</button>
        <div class="shape-editor-body">

      const isDongMarker=element.classList.contains('dong-marker');
      const isSiameseMarker=element.classList.contains('siamese');
      // 삼각형의 도형 중심은 18px 상자의 중앙보다 3px 아래에 있으므로
      // 지도 좌표가 항상 실제 도형 중심에 오도록 엔진별 기준점을 보정한다.
      const anchorX=isDongMarker?Math.max(18,Math.round((element.textContent.length*7+10)/2)):9;
      const anchorY=isDongMarker?10:(isSiameseMarker?12:9);
      if(useNaverMap){
        const contentElement=element.cloneNode(true);contentElement.classList.remove('hidden');
        const marker=new naver.maps.Marker({map,position:new naver.maps.LatLng(lat,lng),zIndex:550,icon:{content:contentElement.outerHTML,anchor:new naver.maps.Point(anchorX,anchorY)}});
        if(onClick)naver.maps.Event.addListener(marker,'click',onClick);
        return {remove:()=>marker.setMap(null),setVisible:value=>marker.setVisible(value),setDraggable:value=>marker.setDraggable(value),getLngLat:()=>{const p=marker.getPosition();return{lng:p.lng(),lat:p.lat()}},setLngLat:(lng2,lat2)=>marker.setPosition(new naver.maps.LatLng(lat2,lng2)),onDragEnd:fn=>naver.maps.Event.addListener(marker,'dragend',fn),raw:marker};
      }
      element.style.zIndex='550';const marker=new maplibregl.Marker({element,anchor:'center',offset:isSiameseMarker?[0,-3]:[0,0]}).setLngLat([lng,lat]).addTo(map);marker.getElement().style.zIndex='550';
      if(typeof marker.setSubpixelPositioning==='function')marker.setSubpixelPositioning(true);
      // Keep pointer movement independent of map panning and native button dragging.
      let draggable=false,drag=null,frame=0,dragEnd=null,suppressClickUntil=0;
      element.style.touchAction='none';
      const flush=()=>{frame=0;if(!drag)return;const p=map.unproject([drag.start.x+drag.dx,drag.start.y+drag.dy]);marker.setLngLat([p.lng,p.lat])};
      const finish=()=>{
        if(!drag)return;
        if(frame){cancelAnimationFrame(frame);frame=0}flush();
        const ended=drag;drag=null;
        if(element.hasPointerCapture(ended.pointerId))element.releasePointerCapture(ended.pointerId);
        if(ended.panEnabled)map.dragPan.enable();
        if(ended.moved){suppressClickUntil=performance.now()+350;if(dragEnd)dragEnd()}
      };
      element.addEventListener('dragstart',e=>e.preventDefault());
      element.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
      element.addEventListener('pointerdown',e=>{
        if(!draggable||!e.isPrimary||e.button!==0)return;
        e.preventDefault();e.stopPropagation();map.stop();
        drag={pointerId:e.pointerId,x:e.clientX,y:e.clientY,start:map.project(marker.getLngLat()),dx:0,dy:0,moved:false,panEnabled:map.dragPan.isEnabled()};
        map.dragPan.disable();element.setPointerCapture(e.pointerId);
      });
      element.addEventListener('pointermove',e=>{
        if(!drag||e.pointerId!==drag.pointerId)return;e.preventDefault();e.stopPropagation();
        drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;
        if(Math.hypot(drag.dx,drag.dy)>2)drag.moved=true;
        if(drag.moved&&!frame)frame=requestAnimationFrame(flush);
      });
      ['pointerup','pointercancel','lostpointercapture'].forEach(type=>element.addEventListener(type,e=>{if(drag&&e.pointerId===drag.pointerId){e.stopPropagation();finish()}}));
      return {remove:()=>{finish();marker.remove()},setVisible:value=>element.classList.toggle('hidden',!value),setDraggable:value=>{if(!value)finish();draggable=value;marker.setDraggable(false)},getLngLat:()=>marker.getLngLat(),setLngLat:(lng2,lat2)=>marker.setLngLat([lng2,lat2]),onDragEnd:fn=>{dragEnd=fn},finishDrag:finish,raw:marker};
    }

    function moveMapTo(lng,lat,zoom){
      if(useNaverMap){map.morph(new naver.maps.LatLng(lat,lng),zoom,{duration:500});}
      else map.easeTo({center:[lng,lat],zoom,duration:500});
    }

    function fitMapTo(apt,points){
      if(useNaverMap){
        const bounds=new naver.maps.LatLngBounds(new naver.maps.LatLng(apt.lat,apt.lng),new naver.maps.LatLng(apt.lat,apt.lng));
        points.forEach(item=>bounds.extend(new naver.maps.LatLng(item.lat,item.lng)));
        map.fitBounds(bounds,{top:70,right:70,bottom:90,left:70});
        if(map.getZoom()>18)map.setZoom(18);
      }else{
        const bounds=points.reduce((box,item)=>box.extend([item.lng,item.lat]),new maplibregl.LngLatBounds([apt.lng,apt.lat],[apt.lng,apt.lat]));
        map.fitBounds(bounds,{padding:{top:70,bottom:90,left:70,right:70},maxZoom:18,duration:500});
      }
    }

    // 2026-09-22 검증값: 동 번호가 부여된 공동주택 주거동만 집계한다.

    async function loadFacilities(){
      try{
        const data = embeddedFacilities;
        const byId = new Map(apartments.map(a=>[a.id,a]));
        let siameseCount=0, receiverCount=0, aptWithData=0;
        Object.keys(data).forEach(aptId=>{
          const apt = byId.get(aptId); if(!apt) return;
          const rec = data[aptId];
          const items = [];
          (rec['연결송수관']||[]).forEach((f,i)=>{const id=`${aptId}-S${i+1}`,saved=savedCorrections[id];items.push({id,type:'siamese',label:f.label||`연결송수관 ${i+1}`,lng:saved?.lng??f.lng,lat:saved?.lat??f.lat,originalLng:f.lng,originalLat:f.lat,source:f.source||'현장 실측'});siameseCount++;});
          (rec['수신반']||[]).forEach((f,i)=>{const id=`${aptId}-R${i+1}`,saved=savedCorrections[id];items.push({id,type:'receiver',label:f.label||`수신반 ${i+1}`,lng:saved?.lng??f.lng,lat:saved?.lat??f.lat,originalLng:f.lng,originalLat:f.lat,source:f.source||'현장 실측'});receiverCount++;});
          apt.facilities = items;
          if(items.length) aptWithData++;
        });
        return {siameseCount, receiverCount, aptWithData};
      }catch(err){
        console.warn('HTML 내부 시설 데이터 적용 실패 — 시설 데이터 없이 지도를 표시합니다.', err);
        return {siameseCount:0, receiverCount:0, aptWithData:0};
      }
    }

    function renderMap(){
      markers.forEach(marker=>marker.remove());markers.clear();
      apartments.filter(apt=>Number.isFinite(apt.lat)&&Number.isFinite(apt.lng)).forEach(apt=>{
        const editable=correctionMode&&selectedApartment===apt.id;
        const aptLogo=document.createElement('button');aptLogo.type='button';aptLogo.className=`marker apt ${selectedApartment===apt.id?'active':''} ${editable?'editing':''}`;aptLogo.innerHTML='<span>APT</span>';aptLogo.title=editable?`${apt.name} · APT 마커 보정`:apt.name;aptLogo.setAttribute('aria-label',`${apt.name} 선택`);
        const selectHandler=e=>{if(e&&e.stopPropagation)e.stopPropagation();editable?selectCorrectionFacility(apt,apt):selectApartment(apt.id)};
        if(!useNaverMap)aptLogo.addEventListener('click',selectHandler);
        const aptMarker=addHtmlMarker(aptLogo,apt.lng,apt.lat,selectHandler);
        aptMarker.setDraggable(editable);aptMarker.onDragEnd(()=>handleFacilityDrag(apt,apt,aptMarker));
        markers.set(apt.id,aptMarker);
        apt.buildings.forEach((building,index)=>{
          const label=document.createElement('div');label.className=`dong-marker ${editable?'editing':''} ${(getMapZoom()>=15.5||editable)?'':'hidden'}`;label.textContent=building.label;label.title=`${apt.name} · ${building.label}`;
          const buildingHandler=e=>{if(e&&e.stopPropagation)e.stopPropagation();if(editable)selectCorrectionFacility(apt,building)};
          if(!useNaverMap)label.addEventListener('click',buildingHandler);
          const buildingMarker=addHtmlMarker(label,building.lng,building.lat,buildingHandler);
          buildingMarker.setVisible(getMapZoom()>=15.5||editable);buildingMarker.setDraggable(editable);buildingMarker.onDragEnd(()=>handleFacilityDrag(apt,building,buildingMarker));
          markers.set(building.id,buildingMarker);
        });
        apt.facilities.forEach(facility=>{
          // 시설 마커는 선택된 단지의 것만 생성한다.
          // 인접 단지의 숨김 마커가 네이버지도에서 다시 노출되는 현상을 원천 차단한다.
          if(apt.id!==selectedApartment)return;
          // 일반지도 조회에서는 지도 캔버스 좌표 레이어를 사용해 확대·축소 중에도 위치를 고정한다.
          // 네이버지도 또는 좌표 보정 모드에서만 HTML 마커를 만든다.
          if(!useNaverMap&&!correctionMode&&!document.getElementById('shapeEditor')?.classList.contains('open'))return;
          const dot=document.createElement('button');dot.type='button';dot.className=`facility-marker ${facility.type} ${correctionMode?'editing':''}`;dot.title=`${apt.name} · ${facility.label}`;dot.setAttribute('aria-label',dot.title);
          const facilityHandler=e=>{if(e&&e.stopPropagation)e.stopPropagation();correctionMode?selectCorrectionFacility(apt,facility):showFacility(apt,facility)};
          if(!useNaverMap)dot.addEventListener('click',facilityHandler);
          const facilityMarker=addHtmlMarker(dot,facility.lng,facility.lat,facilityHandler);
          facilityMarker.setVisible(true);
          facilityMarker.setDraggable(correctionMode);
          facilityMarker.onDragEnd(()=>handleFacilityDrag(apt,facility,facilityMarker));
          markers.set(facility.id,facilityMarker);
        });
      });
      refreshFacilityCanvas();
      updateOfficialBuildingVisibility();
    }

    function updateDongVisibility(){
      const visible=getMapZoom()>=15.5;
      markers.forEach((marker,key)=>{if(key.includes('-D'))marker.setVisible(visible||correctionMode)});
    }
    if(useNaverMap)naver.maps.Event.addListener(map,'zoom_changed',updateDongVisibility);
    else map.on('zoom',updateDongVisibility);

    function matchesApartment(apt,query){
      const q=query.trim().toLowerCase();
      return [apt.name,apt.address,apt.roadAddress,apt.dong].filter(Boolean).join(' ').toLowerCase().includes(q);
    }

    function renderList(query=''){
      const q=query.trim().toLowerCase();
      const filtered=apartments.filter(a=>matchesApartment(a,q));
      document.getElementById('count').textContent=`${filtered.length}개소`;
      document.getElementById('aptList').innerHTML=filtered.map(a=>`<button class="apt-card ${selectedApartment===a.id?'active':''}" data-id="${a.id}"><div class="apt-name">${a.no}. ${a.name}</div><div class="apt-address">${a.address}</div><div class="facility-count">${a.blocks}개 동${a.buildings.length?` · 동 위치 ${a.buildings.length}개`:' · 동 위치 미확인'}${a.facilities.length?` · 시설 ${a.facilities.length}개`:''}</div></button>`).join('') || '<p style="font-size:.82rem;color:#627086;padding:8px">검색 결과가 없습니다.</p>';
      document.querySelectorAll('.apt-card').forEach(el=>el.addEventListener('click',()=>selectApartment(el.dataset.id)));
    }

    function selectApartment(id){
      selectedApartment=id; const apt=apartments.find(a=>a.id===id); if(!apt)return;
      renderMap(); renderList(document.getElementById('searchInput').value);
      updateCorrectionUI();
      closeApartmentDrawer();
      if(isLocalAndroid&&!useNaverMap)map.once('moveend',refreshFacilityCanvas);
      if(Number.isFinite(apt.lat)&&Number.isFinite(apt.lng)){
        if(apt.facilities.length || apt.buildings.length){
          const points=[...apt.facilities,...apt.buildings];
          fitMapTo(apt,points);
        }else{
          moveMapTo(apt.lng,apt.lat,18);
        }
      }
      // 지도 이동 전후의 스타일 상태와 무관하게 현재 선택 단지 시설을 한 번 더 동기화한다.
      refreshFacilityCanvas();
      showApartment(apt);
    }

    function showApartment(apt){
      setDetail('',`${apt.name} ${apt.blocks}개동`,apt.address,[]);
    }

    function showFacility(apt,facility){
      setDetail('',facility.label,'',[]);
    }

    function handleFacilityDrag(apt,facility,marker){
      if(!correctionMode){marker.setLngLat(facility.lng,facility.lat);return;}
      const position=marker.getLngLat();
      applyFacilityCoordinates(apt,facility,position.lat,position.lng,false);
      showCorrectionNotice(`${apt.name} · ${correctionLabel(apt,facility)}`,facility.lat,facility.lng);
    }

    function correctionIdOf(item){return item.correctionId||item.id}
    function correctionKind(apt,item){return item===apt?'아파트 마커':apt.buildings.includes(item)?'동 마커':item.type==='receiver'?'수신반':'연결송수관'}
    function correctionLabel(apt,item){return item===apt?'APT 마커':item.label}

    function selectCorrectionFacility(apt,facility){
      selectedCorrectionFacilityId=correctionIdOf(facility);
      document.getElementById('coordinateSelected').textContent=`${apt.name} · ${correctionLabel(apt,facility)} (${correctionKind(apt,facility)})`;
      document.getElementById('coordinateLat').value=facility.lat.toFixed(8);
      document.getElementById('coordinateLng').value=facility.lng.toFixed(8);
      document.getElementById('coordinateError').textContent='';
      updateCorrectionUI();
      showCorrectionNotice(`${apt.name} · ${correctionLabel(apt,facility)}`,facility.lat,facility.lng);
    }

    function applyFacilityCoordinates(apt,facility,lat,lng,rerender=true){
      const before={lat:facility.lat,lng:facility.lng};
      facility.lat=Number(Number(lat).toFixed(8));facility.lng=Number(Number(lng).toFixed(8));
      const correctionId=correctionIdOf(facility);
      correctionHistory.push({facility,correctionId,before});
      savedCorrections[correctionId]={lat:facility.lat,lng:facility.lng,modifiedAt:new Date().toISOString()};
      persistCorrections();selectCorrectionFacility(apt,facility);
      if(rerender)renderMap();
      updateCorrectionUI();
    }

    function applyTypedCoordinates(){
      const found=findFacilityById(selectedCorrectionFacilityId);if(!correctionMode||!found)return;
      const lat=Number(String(document.getElementById('coordinateLat').value).trim());
      const lng=Number(String(document.getElementById('coordinateLng').value).trim());
      const error=document.getElementById('coordinateError');
      if(!Number.isFinite(lat)||!Number.isFinite(lng)){error.textContent='위도와 경도를 숫자로 입력해 주세요.';return}
      if(lat<-90||lat>90||lng<-180||lng>180){error.textContent='위도(-90~90), 경도(-180~180) 범위를 확인해 주세요.';return}
      error.textContent='';applyFacilityCoordinates(found.apt,found.facility,lat,lng,true);
      showCorrectionNotice(`${found.apt.name} · ${correctionLabel(found.apt,found.facility)}`,found.facility.lat,found.facility.lng);
    }

    function persistCorrections(){
      try{localStorage.setItem(correctionStorageKey,JSON.stringify(savedCorrections));correctionSaveError=false;return true}catch(e){correctionSaveError=true;console.warn('좌표 보정값을 브라우저에 저장하지 못했습니다.',e);return false}
    }

    function updateCorrectionUI(){
      const count=Object.keys(savedCorrections).length;
      const status=document.getElementById('correctionStatus');
      status.textContent=correctionMode?(selectedApartment?'보정 모드 켜짐 · 마커를 끌어 이동':'보정 모드 켜짐 · 아파트를 먼저 선택'):(correctionSaveError?'저장 실패 · CSV로 내보내 주세요':Object.keys(savedCorrections).length?'보정 모드 꺼짐 · 좌표 저장 완료':'보정 모드 꺼짐');
      status.classList.toggle('active',correctionMode);
      document.getElementById('correctionModeBtn').textContent=correctionMode?'좌표 보정 종료':'좌표 보정 시작';
      document.getElementById('correctionCount').textContent=`수정된 마커 ${count}개`;
      document.getElementById('undoCorrectionBtn').disabled=!correctionHistory.length;
      ['resetCorrectionBtn','exportCorrectionBtn'].forEach(id=>document.getElementById(id).disabled=!count);
      const selected=selectedCorrectionFacilityId&&findFacilityById(selectedCorrectionFacilityId);
      ['coordinateLat','coordinateLng','coordinateApplyBtn'].forEach(id=>document.getElementById(id).disabled=!(correctionMode&&selected));
      document.getElementById('clearSavedBtn').disabled=!(selected&&savedCorrections[selectedCorrectionFacilityId]);
    }

    function showCorrectionNotice(title,lat,lng){
      setDetail('좌표 보정',title,'',[['수정 위도',lat.toFixed(8)],['수정 경도',lng.toFixed(8)]],correctionSaveError?'브라우저 저장 실패 · CSV로 내보내 주세요.':'이 브라우저에 저장되었습니다.');
    }

    function findFacilityById(id){for(const apt of apartments){if(apt.correctionId===id)return{apt,facility:apt};const building=apt.buildings.find(item=>item.id===id);if(building)return{apt,facility:building};const facility=apt.facilities.find(item=>item.id===id);if(facility)return{apt,facility}}return null}

    function undoLastCorrection(){
      const entry=correctionHistory.pop();if(!entry)return;
      entry.facility.lat=entry.before.lat;entry.facility.lng=entry.before.lng;
      const isOriginal=Math.abs(entry.facility.lat-entry.facility.originalLat)<1e-10&&Math.abs(entry.facility.lng-entry.facility.originalLng)<1e-10;
      if(isOriginal)delete savedCorrections[entry.correctionId];else savedCorrections[entry.correctionId]={lat:entry.facility.lat,lng:entry.facility.lng,modifiedAt:new Date().toISOString()};
      persistCorrections();renderMap();
      const found=findFacilityById(entry.correctionId);if(found)selectCorrectionFacility(found.apt,found.facility);else updateCorrectionUI();
    }

    function resetAllCorrections(){
      if(!confirm(`수정된 마커 ${Object.keys(savedCorrections).length}개의 좌표를 모두 원래 위치로 되돌릴까요?`))return;
      apartments.forEach(apt=>{apt.lat=apt.originalLat;apt.lng=apt.originalLng;apt.buildings.forEach(item=>{item.lat=item.originalLat;item.lng=item.originalLng});apt.facilities.forEach(item=>{item.lat=item.originalLat;item.lng=item.originalLng})});
      savedCorrections={};correctionHistory.length=0;persistCorrections();renderMap();
      const selected=findFacilityById(selectedCorrectionFacilityId);if(selected)selectCorrectionFacility(selected.apt,selected.facility);else updateCorrectionUI();
    }

    function clearSavedCorrections(){
      const found=findFacilityById(selectedCorrectionFacilityId);if(!found||!savedCorrections[selectedCorrectionFacilityId])return;
      if(!confirm(`${correctionLabel(found.apt,found.facility)}을 원래 좌표로 되돌릴까요?`))return;
      correctionHistory.push({facility:found.facility,correctionId:selectedCorrectionFacilityId,before:{lat:found.facility.lat,lng:found.facility.lng}});
      found.facility.lat=found.facility.originalLat;found.facility.lng=found.facility.originalLng;
      delete savedCorrections[selectedCorrectionFacilityId];persistCorrections();renderMap();selectCorrectionFacility(found.apt,found.facility);
    }

    function csvCell(value){return `"${String(value??'').replace(/"/g,'""')}"`}
    function exportCorrections(){
      const rows=[['아파트ID','아파트명','마커ID','마커명','마커종류','기존위도','기존경도','수정위도','수정경도','수정시각']];
      Object.keys(savedCorrections).forEach(id=>{const found=findFacilityById(id);if(!found)return;const {apt,facility}=found;const saved=savedCorrections[id];rows.push([apt.id,apt.name,id,correctionLabel(apt,facility),correctionKind(apt,facility),facility.originalLat.toFixed(8),facility.originalLng.toFixed(8),facility.lat.toFixed(8),facility.lng.toFixed(8),saved.modifiedAt||''])});
      const csv='\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');
      a.href=url;a.download=`구리시_전체마커_좌표보정_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    }

      const t=document.getElementById('detailType');t.textContent=type;t.style.color=color;t.hidden=!type;
      document.getElementById('detailTitle').textContent=title;document.getElementById('detailSubtitle').textContent=subtitle;
      const summaryEl=document.getElementById('detailSummary');summaryEl.textContent=summary;summaryEl.hidden=!summary;
      const grid=document.getElementById('detailGrid');grid.innerHTML=items.map(([k,v])=>`<div class="info"><b>${k}</b><span>${v}</span></div>`).join('');grid.style.display=items.length?'grid':'none';
      document.getElementById('detail').classList.add('open');
    }

    });

    function applyTypedShapeAngle(){const s=userBuildingShapes.find(x=>x.id===selectedShapeId),input=document.getElementById('shapeAngleInput');if(!s)return;const target=Number(input.value);if(!Number.isFinite(target)){shapeStatus('올바른 회전각을 입력해 주세요.');return}const current=normalizeShapeAngle(s.rotation||0),delta=target-current;if(Math.abs(delta)<1e-9)return;shapeSnapshot();const pts=s.coordinates.slice(0,-1),center=[pts.reduce((a,c)=>a+c[0],0)/pts.length,pts.reduce((a,c)=>a+c[1],0)/pts.length],rotated=rotateShapeCoordinates(pts,center,delta);s.coordinates=[...rotated,[...rotated[0]]];s.rotation=normalizeShapeAngle(target);saveUserShapes();updateShapeAngleUI();renderShapeOverlay();shapeStatus('회전각 '+s.rotation.toFixed(1)+'° 적용 완료')}
    function shapeForCurrent(){return userBuildingShapes.filter(s=>!s.apartmentId||s.apartmentId===selectedApartment)}
    function renderShapeOverlay(){
      syncUserShapeMapLayers();
      const editorOpen=document.getElementById('shapeEditor')?.classList.contains('open');
      if(!useNaverMap&&!editorOpen){shapeSvg.innerHTML='';return}
      shapeSvg.setAttribute('viewBox',`0 0 ${shapeSvg.clientWidth||1} ${shapeSvg.clientHeight||1}`);shapeSvg.innerHTML='';
      shapeForCurrent().forEach(s=>{const p=document.createElementNS(shapeSvg.namespaceURI,'path');p.setAttribute('d',shapePath(s.coordinates));p.setAttribute('fill',s.color||'#d3d1cc');p.setAttribute('fill-opacity','.92');p.setAttribute('stroke',s.stroke||'#777773');p.setAttribute('stroke-width',s.id===selectedShapeId?'3':'1.5');p.dataset.id=s.id;p.classList.add('shape-building');if(s.id===selectedShapeId)p.classList.add('selected');shapeSvg.appendChild(p)});
      const s=userBuildingShapes.find(x=>x.id===selectedShapeId);if(shapeMode==='select'&&s&&(!s.apartmentId||s.apartmentId===selectedApartment)){const visible=s.coordinates.slice(0,-1),screen=visible.map(lngLatToScreen),cx=screen.reduce((a,p)=>a+p[0],0)/screen.length,minY=Math.min(...screen.map(p=>p[1])),anchorY=minY-2,handleY=minY-34;const line=document.createElementNS(shapeSvg.namespaceURI,'line');line.setAttribute('x1',cx);line.setAttribute('y1',anchorY);line.setAttribute('x2',cx);line.setAttribute('y2',handleY);line.classList.add('shape-rotate-line');shapeSvg.appendChild(line);const rotate=document.createElementNS(shapeSvg.namespaceURI,'circle');rotate.setAttribute('cx',cx);rotate.setAttribute('cy',handleY);rotate.setAttribute('r','8');rotate.dataset.id=s.id;rotate.dataset.rotate='true';rotate.classList.add('shape-rotate-handle');shapeSvg.appendChild(rotate);visible.forEach((c,i)=>{const p=screen[i],v=document.createElementNS(shapeSvg.namespaceURI,'circle');v.setAttribute('cx',p[0]);v.setAttribute('cy',p[1]);v.setAttribute('r','5');v.dataset.vertex=i;v.dataset.id=s.id;v.classList.add('shape-handle');shapeSvg.appendChild(v)})}
      if(shapeDraft.length>1){const q=document.createElementNS(shapeSvg.namespaceURI,'path');q.setAttribute('d',shapePath([...shapeDraft,shapeDraft[0]]));q.classList.add('shape-preview');shapeSvg.appendChild(q)}
    }
    function setShapeMode(mode){shapeMode=mode;shapeDraft=[];shapeStart=null;document.querySelectorAll('#shapeTools [data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));shapeSvg.classList.toggle('editing',true);shapeStatus((mode==='select'?'선택·수정':mode==='rectangle'?'사각형':mode==='polygon'?'다각형 · 꼭짓점을 누르고 완료':mode==='freehand'?'자유그리기 · 누른 채 그리기':'스포이드 · 도형을 누르기')+' 모드');renderShapeOverlay()}
    function addShape(coords){if(coords.length<3)return;shapeSnapshot();const closed=coords[0][0]===coords.at(-1)[0]&&coords[0][1]===coords.at(-1)[1]?coords:[...coords,coords[0]];const id='shape-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);userBuildingShapes.push({id,apartmentId:selectedApartment||'',color:document.getElementById('shapeColor').value,stroke:'#777773',coordinates:closed});selectedShapeId=id;shapeDraft=[];saveUserShapes();updateShapeAngleUI();renderShapeOverlay()}
    function finishShape(){if(shapeMode==='polygon'&&shapeDraft.length>=3)addShape(shapeDraft);else{shapeDraft=[];renderShapeOverlay()}}
    function rotateShapeCoordinates(coords,center,degrees){const k=Math.cos(center[1]*Math.PI/180),rad=degrees*Math.PI/180,co=Math.cos(rad),si=Math.sin(rad);return coords.map(c=>{const x=(c[0]-center[0])*k,y=c[1]-center[1];return[center[0]+(x*co-y*si)/k,center[1]+x*si+y*co]})}
    let activeDrag=null,activeRotate=null;
    shapeSvg.addEventListener('pointerdown',e=>{const p=shapePoint(e),ll=screenToLngLat(p),target=e.target,shape=userBuildingShapes.find(s=>s.id===target.dataset.id);if(shapeMode==='eyedropper'&&shape){document.getElementById('shapeColor').value=shape.color;setShapeMode('select');return}if(shapeMode==='select'&&shape&&target.dataset.rotate==='true'){selectedShapeId=shape.id;updateShapeAngleUI();shapeSnapshot();const pts=shape.coordinates.slice(0,-1),center=[pts.reduce((a,c)=>a+c[0],0)/pts.length,pts.reduce((a,c)=>a+c[1],0)/pts.length],cp=lngLatToScreen(center);activeRotate={id:shape.id,center,centerScreen:cp,startAngle:Math.atan2(p.y-cp[1],p.x-cp[0]),startRotation:shape.rotation||0,original:pts.map(c=>[...c]),delta:0};shapeSvg.setPointerCapture(e.pointerId);return}if(shapeMode==='select'&&shape){selectedShapeId=shape.id;updateShapeAngleUI();shapeSnapshot();activeDrag={id:shape.id,vertex:target.dataset.vertex==null?null:Number(target.dataset.vertex),start:ll,original:shape.coordinates.map(c=>[...c])};shapeSvg.setPointerCapture(e.pointerId);renderShapeOverlay();return}if(!selectedApartment){shapeStatus('먼저 아파트 단지를 선택해 주세요.');return}if(shapeMode==='rectangle'){shapeStart=ll;shapeDraft=[ll,ll,ll,ll];shapeSvg.setPointerCapture(e.pointerId)}else if(shapeMode==='freehand'){shapeDraft=[ll];shapeSvg.setPointerCapture(e.pointerId)}});
    shapeSvg.addEventListener('pointermove',e=>{const ll=screenToLngLat(shapePoint(e));if(activeRotate){const s=userBuildingShapes.find(x=>x.id===activeRotate.id);if(!s)return;const angle=Math.atan2(shapePoint(e).y-activeRotate.centerScreen[1],shapePoint(e).x-activeRotate.centerScreen[0]);activeRotate.delta=-(angle-activeRotate.startAngle)*180/Math.PI;const rotated=rotateShapeCoordinates(activeRotate.original,activeRotate.center,activeRotate.delta);s.coordinates=[...rotated,[...rotated[0]]];renderShapeOverlay()}else if(activeDrag){const s=userBuildingShapes.find(x=>x.id===activeDrag.id);if(!s)return;if(activeDrag.vertex!=null){s.coordinates[activeDrag.vertex]=ll;if(activeDrag.vertex===0)s.coordinates[s.coordinates.length-1]=[...ll]}else{const dx=ll[0]-activeDrag.start[0],dy=ll[1]-activeDrag.start[1];s.coordinates=activeDrag.original.map(c=>[c[0]+dx,c[1]+dy])}renderShapeOverlay()}else if(shapeMode==='rectangle'&&shapeStart){shapeDraft=[[shapeStart[0],shapeStart[1]],[ll[0],shapeStart[1]],[ll[0],ll[1]],[shapeStart[0],ll[1]]];renderShapeOverlay()}else if(shapeMode==='freehand'&&shapeDraft.length){const prev=shapeDraft.at(-1),p0=lngLatToScreen(prev),p1=lngLatToScreen(ll);if(Math.hypot(p1[0]-p0[0],p1[1]-p0[1])>5){shapeDraft.push(ll);renderShapeOverlay()}}});
    shapeSvg.addEventListener('pointerup',e=>{if(activeRotate){const degree=activeRotate.delta,s=userBuildingShapes.find(x=>x.id===activeRotate.id);if(s)s.rotation=normalizeShapeAngle(activeRotate.startRotation+degree);activeRotate=null;saveUserShapes();updateShapeAngleUI();renderShapeOverlay();shapeStatus('회전 완료 · 현재 '+(s?s.rotation.toFixed(1):'0.0')+'°')}else if(activeDrag){activeDrag=null;saveUserShapes();renderShapeOverlay()}else if(shapeMode==='rectangle'&&shapeStart){shapeStart=null;addShape(shapeDraft)}else if(shapeMode==='freehand'&&shapeDraft.length){addShape(shapeDraft)}try{shapeSvg.releasePointerCapture(e.pointerId)}catch(_){}});
    shapeSvg.addEventListener('click',e=>{if(shapeMode==='polygon'&&e.target===shapeSvg){shapeDraft.push(screenToLngLat(shapePoint(e)));renderShapeOverlay()}else if(shapeMode==='select'&&e.target===shapeSvg){selectedShapeId=null;updateShapeAngleUI();renderShapeOverlay()}});
    shapeSvg.addEventListener('dblclick',e=>{if(shapeMode==='polygon'){e.preventDefault();finishShape()}});
    document.getElementById('shapeEditorToggle').onclick=e=>{const p=document.getElementById('shapeEditor'),open=p.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open);shapeSvg.classList.toggle('editing',open);syncUserShapeMapLayers();renderMap();refreshFacilityCanvas();renderShapeOverlay()};
    document.querySelectorAll('#shapeTools [data-mode]').forEach(b=>b.onclick=()=>setShapeMode(b.dataset.mode));document.getElementById('shapeFinishBtn').onclick=finishShape;
    document.getElementById('shapeColor').oninput=e=>{const s=userBuildingShapes.find(x=>x.id===selectedShapeId);if(s){shapeSnapshot();s.color=e.target.value;saveUserShapes();renderShapeOverlay()}};
    document.getElementById('applyShapeAngleBtn').onclick=applyTypedShapeAngle;document.getElementById('shapeAngleInput').addEventListener('keydown',e=>{if(e.key==='Enter')applyTypedShapeAngle()});
    document.getElementById('screenEyedropperBtn').onclick=async()=>{if(window.EyeDropper){try{const r=await new EyeDropper().open();document.getElementById('shapeColor').value=r.sRGBHex}catch(_){}}else{setShapeMode('eyedropper');shapeStatus('브라우저 화면 스포이드를 지원하지 않아 도형 색상 추출 모드로 전환했습니다.')}};
    document.getElementById('importAptShapesBtn').onclick=()=>{if(!selectedApartment){shapeStatus('먼저 아파트 단지를 선택해 주세요.');return}const fs=officialBuildingFootprints.features.filter(f=>f.properties.apartmentId===selectedApartment);if(!fs.length){shapeStatus('이 단지에는 불러올 기존 동 외곽선이 없습니다. 새로 그려 주세요.');return}shapeSnapshot();fs.forEach((f,i)=>{const key='official-'+selectedApartment+'-'+(f.properties.building||i);if(!userBuildingShapes.some(s=>s.sourceKey===key))userBuildingShapes.push({id:'shape-'+Date.now()+'-'+i,sourceKey:key,apartmentId:selectedApartment,building:f.properties.building||'',color:document.getElementById('shapeColor').value,stroke:'#777773',coordinates:f.geometry.coordinates[0].map(c=>[...c])})});saveUserShapes();renderShapeOverlay();shapeStatus(fs.length+'개 동 외곽선을 불러왔습니다. 꼭짓점을 끌어 수정하세요.')};
    document.getElementById('deleteShapeBtn').onclick=()=>{if(!selectedShapeId)return;shapeSnapshot();userBuildingShapes=userBuildingShapes.filter(s=>s.id!==selectedShapeId);selectedShapeId=null;updateShapeAngleUI();saveUserShapes();renderShapeOverlay()};
    document.getElementById('undoShapeBtn').onclick=()=>{if(!shapeHistory.length)return;userBuildingShapes=JSON.parse(shapeHistory.pop());saveUserShapes();renderShapeOverlay()};document.getElementById('saveShapesBtn').onclick=saveUserShapes;

    document.addEventListener('keydown',e=>{if(e.key==='Enter'&&shapeMode==='polygon')finishShape();if((e.key==='Delete'||e.key==='Backspace')&&selectedShapeId&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))document.getElementById('deleteShapeBtn').click()});

    updateShapeAngleUI();setInterval(()=>{if(lastShapeApt!==selectedApartment){lastShapeApt=selectedApartment;selectedShapeId=null;updateShapeAngleUI();renderShapeOverlay();shapeStatus(selectedApartment?'선택·수정 모드 · 기존 동 불러오기 또는 새 도형 그리기':'선택·수정 모드 · 단지를 먼저 선택하세요.')}},250);
